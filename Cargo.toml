[package]
name = "local-rocket-stats"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
description = "Match-by-match Rocket League stats and MMR tracker that reads the game's local data (Stats API + log): no login, no online API"
license = "MIT"
repository = "https://github.com/deddroid/local-rocket-stats"
authors = ["deddroid", "Claude (Anthropic)"]
keywords = ["rocket-league", "mmr", "stats", "tracker"]
categories = ["games"]

[dependencies]
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
clap = { version = "4.6", features = ["derive"] }
dirs = "7"
opener = "0.9"
rusqlite = { version = "0.40", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sys-locale = "0.3"
tiny_http = "0.12"
toml = "1"

[target.'cfg(target_os = "linux")'.dependencies]
ksni = { version = "0.3", default-features = false, features = ["blocking", "async-io"] }
libc = "0.2"

[target.'cfg(windows)'.dependencies]
tray-icon = "0.26"
windows-sys = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_System_Console",
    "Win32_System_Registry",
    "Win32_System_Threading",
    "Win32_UI_WindowsAndMessaging",
] }

[target.'cfg(windows)'.build-dependencies]
winresource = "0.1"

[profile.release]
strip = true
lto = true
opt-level = "s"
codegen-units = 1
